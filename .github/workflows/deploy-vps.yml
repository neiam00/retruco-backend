name: Deploy backend to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    # Manual runs must also use the production branch.
    if: github.ref == 'refs/heads/master'
    # Set VPS_RUNNER to a compatible runner label with static egress when SSH
    # is restricted to an allowlist. Standard hosted runners use changing IPs.
    runs-on: ${{ vars.VPS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: retruco_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: retruco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retruco_test -d retruco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    environment:
      name: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate deployment scripts
        run: |
          bash -n deploy/deploy-vps.sh
          sh -n deploy/renew-certificate.sh
          python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Restore Go compilation cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/retruco-go-cache
          key: ${{ runner.os }}-${{ runner.arch }}-go-checks-v1-${{ hashFiles('Dockerfile', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-checks-v1-${{ hashFiles('Dockerfile', 'go.sum') }}-

      - name: Build backend with its Docker toolchain
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: build
          load: true
          tags: retruco-ci
          cache-from: type=gha,scope=backend

      - name: Test backend with its Docker toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/retruco-go-cache"
          docker run --rm --network host \
            -e DATABASE_URL=postgres://retruco_test:disposable_ci_password@127.0.0.1:5432/retruco_test?sslmode=disable \
            -e DATABASE_TEST_URL=postgres://retruco_test:disposable_ci_password@127.0.0.1:5432/retruco_test?sslmode=disable \
            -e GOCACHE=/ci-go-cache \
            --mount "type=bind,source=$RUNNER_TEMP/retruco-go-cache,target=/ci-go-cache" \
            retruco-ci sh -ec '
              /out/migrate up
              CGO_ENABLED=1 go test -race -count=1 ./...
              go vet ./...
              go test -count=1 -tags=integration ./internal/api -run "^TestVoiceCloudflare"
            '

      - name: Package the tested backend for deployment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: retruco-backend:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # The same builder reuses the compiled build stage above. Export all
          # intermediate layers for the next run, without exporting twice.
          cache-to: type=gha,scope=backend,mode=max

      - name: Configure verified SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Set VPS_HOST}"
          : "${VPS_SSH_PRIVATE_KEY:?Set VPS_SSH_PRIVATE_KEY}"
          : "${VPS_KNOWN_HOSTS:?Set VPS_KNOWN_HOSTS}"
          VPS_USER="${VPS_USER:-root}"
          VPS_PORT="${VPS_PORT:-22}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo "VPS_HOST must be an IPv4 address or hostname"; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "Invalid VPS_USER"; exit 1; }
          if ! [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$VPS_PORT < 1 || 10#$VPS_PORT > 65535 )); then
            echo "Invalid VPS_PORT"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/retruco-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/retruco-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/retruco-ssh/known_hosts"
          if ! ssh-keygen -y -P "" -f "$RUNNER_TEMP/retruco-ssh/key" > /dev/null 2>&1; then
            echo "VPS_SSH_PRIVATE_KEY must contain a complete, valid private key without a passphrase." >&2
            exit 1
          fi
          lookup="$VPS_HOST"
          if [[ "$VPS_PORT" != 22 ]]; then lookup="[$VPS_HOST]:$VPS_PORT"; fi
          if ! ssh-keygen -F "$lookup" -f "$RUNNER_TEMP/retruco-ssh/known_hosts" > /dev/null; then
            echo "VPS_KNOWN_HOSTS has no entry matching VPS_HOST and VPS_PORT." >&2
            echo "Use the full verified known-hosts line for the exact hostname/IP, not just its SHA256 fingerprint or your client public key." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/retruco-ssh/config" <<EOF
          Host retruco-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile $RUNNER_TEMP/retruco-ssh/key
            UserKnownHostsFile $RUNNER_TEMP/retruco-ssh/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF

      - name: Upload and deploy
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/retruco-source.tar.gz"
          image_archive="$RUNNER_TEMP/retruco-image.tar.gz"
          image="retruco-backend:$GITHUB_SHA"
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid built image ID" >&2; exit 1; }
          remote_archive="/tmp/retruco-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote_image="/tmp/retruco-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote_script="/tmp/retruco-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          git archive --format=tar.gz --output="$archive" HEAD -- . ':(exclude).env' ':(exclude).env.*'
          docker image save "$image" | gzip -1 > "$image_archive"
          scp -F "$RUNNER_TEMP/retruco-ssh/config" "$archive" "retruco-vps:$remote_archive"
          scp -F "$RUNNER_TEMP/retruco-ssh/config" "$image_archive" "retruco-vps:$remote_image"
          scp -F "$RUNNER_TEMP/retruco-ssh/config" deploy/deploy-vps.sh "retruco-vps:$remote_script"
          # Keep the script separate from command stdin, and independently
          # require the success marker before accepting a successful SSH exit.
          ssh -n -F "$RUNNER_TEMP/retruco-ssh/config" retruco-vps \
            "trap 'rm -f $remote_script $remote_archive $remote_image' EXIT; bash $remote_script $remote_archive $GITHUB_SHA $remote_image $image_id && test \"\$(cat /opt/retruco/backend/.deployed-revision)\" = $GITHUB_SHA"

      - name: Remove runner credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/retruco-ssh" "$RUNNER_TEMP/retruco-source.tar.gz" "$RUNNER_TEMP/retruco-image.tar.gz"
