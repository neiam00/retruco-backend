[project]
name = "retruco-ml"
version = "0.1.0"
description = "Training and evaluation tools for the Retruco browser CPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = ["torch>=2.9,<3", "numpy>=2,<3"]

[project.urls]
Repository = "https://github.com/neiam00/retruco-backend"

[project.scripts]
retruco-train = "retruco_ml.train:main"
retruco-export = "retruco_ml.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retruco_ml"]

[dependency-groups]
dev = ["ruff>=0.17.5,<0.18"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["runs", "reports", "runtime/target"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
