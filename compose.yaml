services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: retruco
      POSTGRES_DB: retruco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retruco -d retruco"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["./migrate", "up"]
    environment:
      DATABASE_URL: postgres://retruco:${POSTGRES_PASSWORD}@db:5432/retruco?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgres://retruco:${POSTGRES_PASSWORD}@db:5432/retruco?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
