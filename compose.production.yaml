services:
  api:
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set the frontend origin(s) in .env.production}
      COOKIE_SECURE: "true"
      API_PROXY_SECRET: ${API_PROXY_SECRET:?Set API_PROXY_SECRET in both API and Cloudflare Pages}
      GOMEMLIMIT: ${GOMEMLIMIT:-512MiB}
      PASSWORD_WORK_DUTY_PERCENT: ${PASSWORD_WORK_DUTY_PERCENT:-20}
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
  proxy:
    image: nginx:stable-alpine
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?Set the backend origin hostname}
    ports:
      # DNS-01 renewal needs no HTTP listener. Restrict this published port to
      # Cloudflare source ranges in the provider firewall (Docker can bypass UFW).
      - "443:443"
    volumes:
      - ./deploy/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:?Set the certificate directory}:/etc/nginx/tls:ro
    depends_on:
      - api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
